# Generated from themes/tokyo-night.toml. Edit the manifest, then rerun the generator.
format = "$directory$git_branch$git_status$character"
palette = "tokyo_night"

[directory]
truncation_length = 4
style = "bold blue"

[git_branch]
style = "bold purple"

[git_status]
style = "red"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"

[palettes.tokyo_night]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
purple = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
bright_black = "#414868"
bright_red = "#f7768e"
bright_green = "#9ece6a"
bright_yellow = "#e0af68"
bright_blue = "#7aa2f7"
bright_purple = "#bb9af7"
bright_cyan = "#7dcfff"
bright_white = "#c0caf5"
