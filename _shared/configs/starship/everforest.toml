# Generated from themes/everforest.toml. Edit the manifest, then rerun the generator.
format = "$directory$git_branch$git_status$character"
palette = "everforest"

[directory]
truncation_length = 4
style = "bold blue"

[git_branch]
style = "bold purple"

[git_status]
style = "red"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"

[palettes.everforest]
black = "#343f44"
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
purple = "#d699b6"
cyan = "#83c092"
white = "#d3c6aa"
bright_black = "#859289"
bright_red = "#e67e80"
bright_green = "#a7c080"
bright_yellow = "#dbbc7f"
bright_blue = "#7fbbb3"
bright_purple = "#d699b6"
bright_cyan = "#83c092"
bright_white = "#d3c6aa"
