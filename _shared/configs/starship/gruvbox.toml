# Generated from themes/gruvbox.toml. Edit the manifest, then rerun the generator.
format = "$directory$git_branch$git_status$character"
palette = "gruvbox"

[directory]
truncation_length = 4
style = "bold blue"

[git_branch]
style = "bold purple"

[git_status]
style = "red"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"

[palettes.gruvbox]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
purple = "#b16286"
cyan = "#689d6a"
white = "#a89984"
bright_black = "#928374"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_purple = "#d3869b"
bright_cyan = "#8ec07c"
bright_white = "#ebdbb2"
