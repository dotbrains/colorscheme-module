# Generated from themes/nord.toml. Edit the manifest, then rerun the generator.
format = "$directory$git_branch$git_status$character"
palette = "nord"

[directory]
truncation_length = 4
style = "bold blue"

[git_branch]
style = "bold purple"

[git_status]
style = "red"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"

[palettes.nord]
black = "#3b4252"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
purple = "#b48ead"
cyan = "#88c0d0"
white = "#e5e9f0"
bright_black = "#4c566a"
bright_red = "#bf616a"
bright_green = "#a3be8c"
bright_yellow = "#ebcb8b"
bright_blue = "#81a1c1"
bright_purple = "#b48ead"
bright_cyan = "#8fbcbb"
bright_white = "#eceff4"
