# Generated from themes/catppuccin.toml. Edit the manifest, then rerun the generator.
format = "$directory$git_branch$git_status$character"
palette = "catppuccin"

[directory]
truncation_length = 4
style = "bold blue"

[git_branch]
style = "bold purple"

[git_status]
style = "red"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"

[palettes.catppuccin]
black = "#494d64"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
purple = "#f5bde6"
cyan = "#8bd5ca"
white = "#b8c0e0"
bright_black = "#5b6078"
bright_red = "#ed8796"
bright_green = "#a6da95"
bright_yellow = "#eed49f"
bright_blue = "#8aadf4"
bright_purple = "#f5bde6"
bright_cyan = "#8bd5ca"
bright_white = "#a5adcb"
