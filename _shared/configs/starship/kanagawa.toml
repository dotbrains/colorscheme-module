# Generated from themes/kanagawa.toml. Edit the manifest, then rerun the generator.
format = "$directory$git_branch$git_status$character"
palette = "kanagawa"

[directory]
truncation_length = 4
style = "bold blue"

[git_branch]
style = "bold purple"

[git_status]
style = "red"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"

[palettes.kanagawa]
black = "#090618"
red = "#c34043"
green = "#76946a"
yellow = "#c0a36e"
blue = "#7e9cd8"
purple = "#957fb8"
cyan = "#6a9589"
white = "#c8c093"
bright_black = "#727169"
bright_red = "#e82424"
bright_green = "#98bb6c"
bright_yellow = "#e6c384"
bright_blue = "#7fb4ca"
bright_purple = "#938aa9"
bright_cyan = "#7aa89f"
bright_white = "#dcd7ba"
